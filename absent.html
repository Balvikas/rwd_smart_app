<!DOCTYPE html>
<html lang="en">
<head>
    <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Absentee Audit</title>
    <style>
        /* CSS RESET & ROOT BOUNDS */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #ea580c;
            --primary-dark: #9a3412;
            --bg: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #fee2e2;
        }
        body { 
            background-color: var(--bg); 
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            color: var(--text-main); 
            padding: 1rem 0.75rem;
            -webkit-font-smoothing: antialiased;
        }
        .container { 
            width: 100%; 
            max-width: 650px; 
            margin: 0 auto; 
            background: white; 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            padding: 1.5rem; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.04); 
        }
        
        /* PREMIUM BACK NAVIGATION ARROW */
        .btn-back-kiosk {
            display: inline-flex; 
            align-items: center; 
            gap: 0.5rem; 
            color: #475569;
            text-decoration: none; 
            font-weight: 700; 
            font-size: 0.85rem; 
            padding: 0.6rem 1rem;
            border: 2px solid #cbd5e1; 
            border-radius: 8px; 
            margin-bottom: 1.5rem;
            transition: all 0.2s ease; 
            background-color: #f1f5f9; 
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-back-kiosk:hover { 
            color: var(--primary); 
            border-color: var(--primary); 
            background-color: #fff7ed; 
        }

        .header { text-align: center; margin-bottom: 1.5rem; border-bottom: 2px solid #fed7aa; padding-bottom: 1rem; }
        .header h1 { font-size: 1.6rem; color: var(--primary-dark); font-weight: 800; letter-spacing: -0.02em; }
        .header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.2rem; }
        
        /* ⚠️ FIXED IPHONE LAYOUT: Strictly stacked vertically using block layout parameters to prevent any overlapping */
        .search-box { 
            display: block; 
            width: 100%;
        }
        .field-group { 
            width: 100%; 
            margin-bottom: 1.25rem; /* Forces clean, unmovable space below calendar box */
        }
        .control-label { 
            display: block; 
            font-size: 0.8rem; 
            font-weight: 700; 
            color: var(--text-muted); 
            margin-bottom: 0.5rem; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
        }
        .input-calendar { 
            width: 100%; 
            padding: 0.9rem 1.2rem; 
            font-size: 1.1rem; 
            border-radius: 12px; 
            border: 2px solid var(--border); 
            background-color: var(--bg); 
            color: var(--text-main); 
            outline: none; 
            transition: all 0.2s ease; 
            display: block;
        }
        .input-calendar:focus { border-color: var(--primary); background-color: white; box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.08); }
        
        .btn-audit { 
            display: flex; 
            width: 100%;
            height: 52px; 
            font-size: 1.05rem; 
            font-weight: 700; 
            border-radius: 12px; 
            border: none; 
            color: white; 
            background-color: var(--primary); 
            cursor: pointer; 
            align-items: center; 
            justify-content: center; 
            gap: 0.5rem; 
            transition: transform 0.1s ease, filter 0.2s ease; 
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.15);
            -webkit-tap-highlight-color: transparent;
            margin-top: 0.5rem;
        }
        .btn-audit:hover { filter: brightness(0.92); }
        .btn-audit:active { transform: scale(0.98); }
        
        .status-alert { margin-top: 1rem; padding: 0.85rem; border-radius: 10px; text-align: center; font-weight: 700; font-size: 0.9rem; display: none; }
        .alert-danger { background-color: var(--danger); color: #991b1b; }

        /* TABLET & LAPTOP EXPANSION BREAKPOINTS */
        @media (min-width: 576px) {
            body { padding: 2rem 1rem; }
            .container { padding: 2.5rem; }
            .header h1 { font-size: 1.8rem; }
            .search-box { display: flex; align-items: flex-end; gap: 0.75rem; }
            .field-group { margin-bottom: 0; }
            .btn-audit { width: auto; height: 52px; margin-top: 0; padding: 0 2rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-back-kiosk">
        <svg xmlns="http://w3.org" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Return to Kiosk
    </a>

    <div class="header">
        <h1>📋 Date Wise Absentee Auditor</h1>
        <p>Cross-reference master rosters to find missing students by date</p>
    </div>

    <div class="search-box">
        <div class="field-group">
            <label for="auditDate" class="control-label">Select Audit Date</label>
            <input type="date" id="auditDate" class="input-calendar">
        </div>
        <button type="button" class="btn-audit" onclick="runAbsenteeAudit()">
            <svg xmlns="http://w3.org" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="18" y2="10"></line>
            </svg>
            Run Audit
        </button>
    </div>
    <div id="statusAlert" class="status-alert"></div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = GLOBAL_CONFIG.GOOGLE_SCRIPT_URL;

    window.addEventListener("DOMContentLoaded", () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById("auditDate").value = today;
    });

    function runAbsenteeAudit() {
        const dateInput = document.getElementById("auditDate").value;
        const alertBox = document.getElementById("statusAlert");
        if (!dateInput) {
            alertBox.className = "status-alert alert-danger";
            alertBox.style.display = "block";
            alertBox.textContent = "❌ Please pick a date using the calendar input field.";
            return;
        }
        alertBox.style.display = "none";
        window.open(`${GOOGLE_SCRIPT_URL}?action=getAbsenteesByDate&dateStr=${dateInput}`, '_blank');
    }
</script>
</body>
</html>
